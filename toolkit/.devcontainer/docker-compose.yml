# VS Code Dev Container for the ROS 2 VxWorks SDK kit.
#
# Two-stage build (as shipped by the project): vxbuild -> vxros2build.
# Your (licensed) vanilla Wind River VxWorks SDK is MOUNTED at /wrsdk (never
# baked into an image). Set WRSDK in a .env file next to this compose file, or
# in your environment, to your SDK path, e.g.:
#   WRSDK=/home/me/Downloads/wrsdk-vxworks7-qemu
#
services:
  # Base image (FROM ubuntu). Built first; not started.
  vxbuild:
    build:
      context: ../docker/vxbuild
    image: vxbuild:26.04
    profiles: ["build-only"]

  # The dev environment the user works in.
  dev:
    build:
      context: ../docker/vxros2build
      args:
        BASE_IMAGE: vxbuild:26.04
        ROS_DISTRO: lyrical
    image: vxros2build:lyrical
    depends_on:
      - vxbuild
    # Keep it alive so VS Code can attach.
    command: sleep infinity
    volumes:
      - ${WRSDK:?set WRSDK to your vanilla VxWorks SDK path}:/wrsdk
      - ..:/kit            # the ROS 2 SDK kit (export/root, scripts/, ros2.img, repos/)
      - ../..:/work        # your workspace (parent of the kit); adjust as needed
    environment:
      WRSDK: /wrsdk
      KIT: /kit
    # QEMU on-target testing needs /dev/kvm + tap networking; enable if available.
    # devices:
    #   - /dev/kvm
    # cap_add: [NET_ADMIN]
