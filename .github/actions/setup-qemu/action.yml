# Set up the QEMU test host for the VxWorks ROS 2 on-target tests: expect, the
# QEMU the target is tested with, KVM access and the tap0 NIC. Used by the
# ros2-test, toolkit-test and unixextra-tests jobs.
#
# Which QEMU comes from the release's pkg/sdk/files/<rel>/defs.sdk.mk (QEMU_REPO,
# QEMU_RELEASE, QEMU_BIN for the target arch), read from output/qemu.env (written
# by `make qemu-env` in the build job, shipped with the HDD image), or, when that
# file is absent and an SDK is sourced, straight from `make -C pkg/sdk sdk.get-qemu`.
name: 'Setup QEMU test host'
description: 'Install QEMU + expect, enable KVM, create tap0 for the VxWorks tests'

runs:
  using: 'composite'
  steps:
    - name: Install QEMU and expect
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -e
        sudo apt-get update
        sudo apt-get install -y expect uml-utilities

        qemu_env="$GITHUB_WORKSPACE/output/qemu.env"
        if [ ! -f "$qemu_env" ]; then
          [ -n "${WIND_SDK_HOME:-}" ] \
            || { echo "no $qemu_env and no SDK sourced: cannot tell which QEMU to install"; exit 1; }
          mkdir -p "$(dirname "$qemu_env")"
          make -s --no-print-directory -C "$GITHUB_WORKSPACE/pkg/sdk" \
            WIND_USR_MK="$GITHUB_WORKSPACE/mk/usr" sdk.get-qemu > "$qemu_env"
        fi
        cat "$qemu_env"
        . "$qemu_env"
        [ -n "$QEMU_RELEASE" ] && [ -n "$QEMU_BIN" ] \
          || { echo "QEMU_RELEASE/QEMU_BIN unset in $qemu_env (no QEMU in this release's defs.sdk.mk?)"; exit 1; }

        if [ "$QEMU_RELEASE" = host ]; then
          # the test host's distro QEMU: the package that provides $QEMU_BIN
          case "$QEMU_BIN" in
            qemu-system-x86_64)  pkg=qemu-system-x86 ;;
            qemu-system-aarch64) pkg=qemu-system-arm ;;
            *) echo "no distro package known for $QEMU_BIN"; exit 1 ;;
          esac
          sudo apt-get install -y "$pkg"
        else
          # a .deb from the QEMU_REPO GitHub release, for this host's architecture
          # (amd64 on ubuntu-26.04, arm64 on ubuntu-26.04-arm). Authenticated
          # download (gh + the job token): the anonymous GitHub API rate limit on
          # shared runners returns 403.
          arch=$(dpkg --print-architecture)
          dl=/tmp/qemu-deb; rm -rf "$dl" && mkdir -p "$dl"
          gh release download "$QEMU_RELEASE" -R "${QEMU_REPO#https://github.com/}" -p "*_${arch}.deb" -D "$dl"
          deb="$(ls "$dl"/*_${arch}.deb 2>/dev/null | head -1)"
          [ -n "$deb" ] || { echo "no .deb for $arch in $QEMU_REPO release $QEMU_RELEASE"; exit 1; }
          echo "QEMU deb: $deb"
          sudo apt-get install -y "$deb"
          # the deb may name its emulator differently (razr/qemu-raspi4-deb:
          # qemu-system-aarch64-raspi4); link it to $QEMU_BIN, the name the tests run
          bin="$(dpkg-deb -c "$deb" | grep -o 'usr/bin/qemu-system-[^ ]*' | head -1)"
          [ -n "$bin" ] || { echo "no qemu-system-* in $deb"; exit 1; }
          [ "$(basename "$bin")" = "$QEMU_BIN" ] || sudo ln -sf "/$bin" "/usr/local/bin/$QEMU_BIN"
        fi
        "$QEMU_BIN" --version | head -1

        # KVM for the x86 target: /dev/kvm is crw-rw---- root:kvm and
        # `usermod -aG kvm` does not apply to the running job shell, so
        # -enable-kvm fails with "Permission denied". Make the device accessible
        # now (qemu.exp falls back to TCG if it still is not writable; aarch64
        # always runs TCG).
        sudo usermod -aG kvm "$USER" || true
        if [ -e /dev/kvm ]; then sudo chmod 0666 /dev/kvm || true; fi
        ls -l /dev/kvm || echo "no /dev/kvm on this runner (x86 tests run under TCG)"

        # tap0 for the target NIC (both targets use 192.168.200.254 on the host)
        sudo tunctl -u $USER -t tap0
        sudo ifconfig tap0 192.168.200.254 up
