name: "Lyrical 26.03 QEMU Build"

on:
  schedule:
    - cron: '0 4 * * 0'  # every Sunday at 04:00 UTC

  workflow_dispatch:
    inputs:
      test:
        description: "run tests"
        type: boolean
        default: true
      toolkit:
        description: "build toolkit"
        type: boolean
        default: true
      layer_url:
        description: "vxworks7-layer-for-ros2 URL"
        type: string
        default: "https://github.com/razr/vxworks7-layer-for-ros2.git"
      debug:
        description: "enable debug mode"
        type: boolean
        default: false

jobs:
  build-lyrical:
    uses: ./.github/workflows/vxworks-ros2-build.yaml
    with:
      ros_distro: lyrical
      vxworks: "26.03"
      sdk: qemu
      # On manual dispatch use the checkbox values; on schedule inputs.* is empty
      # so fall back to: test on, toolkit off. (Compare to 'true' as a string to
      # avoid the `false || true` short-circuit gotcha with boolean inputs.)
      test: ${{ github.event_name != 'workflow_dispatch' || inputs.test == true }}
      toolkit: ${{ github.event_name != 'workflow_dispatch' || inputs.toolkit == true }}
      debug: ${{ github.event_name == 'workflow_dispatch' && inputs.debug == true }}
      # TEMPORARY: the razr layer fork carries the sqlite_vendor/libyaml_vendor/
      # pyyaml_vendor patches until they are merged into Wind-River; then drop this.
      layer_url: ${{ inputs.layer_url || 'https://github.com/razr/vxworks7-layer-for-ros2.git' }}
 
